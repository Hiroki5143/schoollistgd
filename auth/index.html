<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in / Sign up</title>
<style>
  :root{
    --ink: #e6e9ec;
    --paper: #11161C;
    --line: #2a323b;
    --accent: #9BA8B5;
    --accent-hover: #FFFFFF;
    --accent-ink: #11161C;
    --muted: #889199;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    font-family: "Comic Sans MS", cursive;
    color:var(--ink);
    padding:24px;
  }
  .card{
    width:100%;
    max-width:340px;
  }
  .tabs{
    display:flex;
    margin-bottom:32px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1;
    background:none;
    border:none;
    font-family:inherit;
    font-size:0.95rem;
    color:var(--muted);
    padding:0 0 12px;
    cursor:pointer;
    position:relative;
    letter-spacing:0.02em;
  }
  .tab.active{
    color:var(--ink);
  }
  .tab.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px;
    background:var(--accent);
  }
  h1{
    font-size:1.6rem;
    font-weight:normal;
    margin:0 0 24px;
    letter-spacing:0.02em;
  }
  label{
    display:block;
    font-size:0.85rem;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field{
    margin-bottom:20px;
  }
  input{
    width:100%;
    padding:10px 2px;
    font-size:1rem;
    font-family: inherit;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    outline:none;
    transition: border-color 0.2s ease;
  }
  input:focus{
    border-bottom-color:var(--accent);
  }
  button.submit{
    width:100%;
    margin-top:12px;
    padding:11px;
    font-size:0.95rem;
    font-family: inherit;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  button.submit:hover{
    background:var(--accent-hover);
  }
  button:focus-visible, a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  hr{
    border:none;
    border-top:1px solid var(--line);
    margin:28px 0 20px;
  }
  .switch{
    text-align:center;
    font-size:0.9rem;
    color:var(--muted);
  }
  .switch a{
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px solid var(--accent);
    cursor:pointer;
  }
  .switch a:hover{
    opacity:0.75;
  }
  .panel{ display:none; }
  .panel.active{ display:block; }
</style>
</head>
<body>
  <div class="card">
    <div class="tabs">
      <button type="button" class="tab active" id="tab-signin">Sign in</button>
      <button type="button" class="tab" id="tab-signup">Sign up</button>
    </div>

    <div class="panel active" id="panel-signin">
      <h1>Welcome back</h1>
      <form id="signin-form">
        <div class="field">
          <label for="si-username">Username</label>
          <input type="text" id="si-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="si-password">Password</label>
          <input type="password" id="si-password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="submit">Sign in</button>
      </form>
      <hr>
      <p class="switch">Don't have an account? <a id="go-signup">Click here to sign up</a></p>
    </div>

    <div class="panel" id="panel-signup">
      <h1>Create an account</h1>
      <form id="signup-form">
        <div class="field">
          <label for="su-username">Username</label>
          <input type="text" id="su-username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="su-password">Password</label>
          <input type="password" id="su-password" name="password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="submit">Sign up</button>
      </form>
      <hr>
      <p class="switch">Already have an account? <a id="go-signin">Sign in instead</a></p>
    </div>
  </div>

  <script>
  const API_URL = "worker-editor.hirokiuseunusedemail.workers.dev";

  const tabSignin = document.getElementById('tab-signin');
  const tabSignup = document.getElementById('tab-signup');
  const panelSignin = document.getElementById('panel-signin');
  const panelSignup = document.getElementById('panel-signup');

  function showSignin(){
    tabSignin.classList.add('active');
    tabSignup.classList.remove('active');
    panelSignin.classList.add('active');
    panelSignup.classList.remove('active');
  }

  function showSignup(){
    tabSignup.classList.add('active');
    tabSignin.classList.remove('active');
    panelSignup.classList.add('active');
    panelSignin.classList.remove('active');
  }

  tabSignin.addEventListener('click', showSignin);
  tabSignup.addEventListener('click', showSignup);
  document.getElementById('go-signup').addEventListener('click', showSignup);
  document.getElementById('go-signin').addEventListener('click', showSignin);


  // SIGN IN
  document.getElementById('signin-form').addEventListener('submit', async function(e){
    e.preventDefault();

    const username = document.getElementById('si-username').value.trim();
    const password = document.getElementById('si-password').value;

    try {
      const response = await fetch(API_URL + "/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username,
          password
        })
      });

      const data = await response.json();

      if (!data.success) {
        alert(data.error);
        return;
      }

      sessionStorage.setItem("auth_token", data.token);
      sessionStorage.setItem("username", data.username);

      // Change this to the page users should see after logging in
      window.location.href = "/";

    } catch (error) {
      alert("Could not connect to the login server.");
      console.error(error);
    }
  });


  // SIGN UP
  document.getElementById('signup-form').addEventListener('submit', async function(e){
    e.preventDefault();

    const username = document.getElementById('su-username').value.trim();
    const password = document.getElementById('su-password').value;

    try {
      const response = await fetch(API_URL + "/signup", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username,
          password
        })
      });

      const data = await response.json();

      if (!data.success) {
        alert(data.error);
        return;
      }

      alert("Account created! You can now sign in.");

      document.getElementById('su-password').value = "";
      document.getElementById('si-username').value = username;

      showSignin();

    } catch (error) {
      alert("Could not connect to the login server.");
      console.error(error);
    }
  });
  </script>
</body>
</html>
