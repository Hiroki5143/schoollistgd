<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>School List GD</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Comic Sans MS", cursive;
  }

  body {
    background-color: #11161C;
  }

  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    padding: 0 20px;
    background-color: #464e57;
  }

  .nav-left,
  .nav-right {
    display: flex;
    align-items: center;
    height: 100%;
  }

  .nav-item {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 16px;
    color: #9BA8B5;
    text-decoration: none;
    font-size: 17px;
    white-space: nowrap;
    border-radius: 0; /* rectangle, no rounded edges */
    transition: background-color 0.5s cubic-bezier(0.37, 0, 0.63, 1), color 0.3s cubic-bezier(0.37, 0, 0.63, 1);
  }

  .nav-item:hover {
    background-color: #63B0F2;
    color: #FFFFFF;
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <a href="#" class="nav-item">SLGD</a>
      <a href="#" class="nav-item">List</a>
      <a href="#" class="nav-item">Players</a>
    </div>
    <div class="nav-right">
      <a href="#" class="nav-item">Submit Record</a>
      <a href="/auth/" class="nav-item" id="account-name">Login</a>
    </div>
  </nav>
<script>
  const API_URL = "https://worker-editor.hirokiuseunusedemail.workers.dev";
  const accountName = document.getElementById("account-name");
  const token = sessionStorage.getItem("auth_token");

  async function checkLogin() {
    if (!token) {
      accountName.textContent = "Login";
      accountName.href = "/auth/";
      return;
    }

    try {
      const response = await fetch(API_URL + "/me", {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      const data = await response.json();

      if (data.loggedIn) {
        accountName.textContent = data.username;
        accountName.href = "#";

        accountName.addEventListener("click", function(e) {
          e.preventDefault();

          if (confirm("Log out?")) {
            logout();
          }
        });
      } else {
        sessionStorage.removeItem("auth_token");
        sessionStorage.removeItem("username");

        accountName.textContent = "Login";
        accountName.href = "/auth/";
      }

    } catch (error) {
      console.error("Login check failed:", error);
      accountName.textContent = "Login";
      accountName.href = "/auth/";
    }
  }

  async function logout() {
    try {
      await fetch(API_URL + "/logout", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token
        }
      });
    } catch (error) {
      console.error("Logout failed:", error);
    }

    sessionStorage.removeItem("auth_token");
    sessionStorage.removeItem("username");

    window.location.href = "/";
  }

  checkLogin();
</script>
</body>
</html>
